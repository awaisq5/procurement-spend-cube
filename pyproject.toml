[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spendcube"
version = "1.0.0"
description = "Supplier normalisation, rule-first spend classification and a DuckDB spend cube."
readme = "README.md"
license = "MIT"
authors = [{ name = "Awais Hanif Qurashi" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "rapidfuzz>=3.0", "duckdb>=1.0", "jinja2>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
spendcube = "spendcube.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spendcube"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/spendcube/taxonomy.py" = ["E501"]
"scripts/*" = ["E501"]
"src/spendcube/analytics.py" = ["E501"]  # SQL reads better unwrapped
